function productsOf(x){return String(x.products||'').split(/\s*;\s*/).map(v=>v.trim()).filter(Boolean)}

function localizeText(value){let s=String(value||'');if(T.exact[s])return T.exact[s];for(const [from,to] of T.terms)s=s.replace(new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),to);return s}
function followupLabel(date){if(!date)return t('not_scheduled');let d=new Date(date+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);let delta=Math.round((d-today)/86400000);if(delta<0)return t('overdue').replace('{n}',Math.abs(delta));if(delta===0)return t('today');if(delta<=7)return t('in_days').replace('{n}',delta);return d.toLocaleDateString(LANG==='ko'?'ko-KR':'zh-TW',{month:'short',day:'numeric'})}

s="follow-input" data-follow="${esc(x.id)}" type="date" value="${esc(r.followup)}" aria-label="${t('followup_date_for')} ${esc(x.name)}"></label></div><button class="explore" data-explore="${esc(x.id)}">${t('explore_company')} <span>→</span></button></article>`}
function draw(){let grid=$('cardGrid'),rows=filtered();$('visibleCount').textContent=rows.length;$('marketLabel').textContent=`${T.countries[state.country]} · ${t('prospects')}`;$('heroTotal').textContent=DATA.leads.length;if(state.loading){grid.innerHTML=skeletons();return}if(!rows.length){grid.innerHTML=`<div class="empty-state"><div class="empty-art">⌕</div><h3>${t('empty_title')}</h3><p>${t('empty_copy')}</p><button class="clear-btn" id="clearFilters">${t('clear_filters')}</button></div>`;$('clearFilters').onclick=clearFilters;return}grid.innerHTML=rows.map(card).join('');grid.querySelectorAll('[data-sales]').forEach(el=>el.onchange=()=>{rec(el.dataset.sales).salesStatus=el.value;save()});grid.querySelectorAll('[data-follow]').forEach(el=>el.onchange=()=>{rec(el.dataset.follow).followup=el.value;save();let lab=grid.querySelector(`[data-follow-label="${CSS.escape(el.dataset.follow)}"]`);if(lab)lab.textContent=followupLabel(el.value)});grid.querySelectorAll('[data-explore]').forEach(el=>el.onclick=()=>openProfile(el.dataset.explore))}

function contactItem(label,value,kind='text'){if(kind==='link'&&urlOK(value))return `<div class="contact-item"><small>${label}</small><a href="${esc(value)}" target="_blank" rel="noopener">${t('open_official_link')} ↗</a></div>`;if(kind==='email'&&String(value||'').includes('@'))return `<div class="contact-item"><small>${label}</small><a href="mailto:${esc(value)}">${esc(value)}</a></div>`;return `<div class="contact-item"><small>${label}</small><span>${esc(value||'無')}</span></div>`}
function openProfile(id){let x=DATA.leads.find(v=>v.id===id);if(!x)return;state.profileId=id;let r=rec(id),all=productsOf(x),phone=(String(x.publicContact||'').match(/Phone:\s*([^;]+)/i)||[])[1]||'無';$('listView').classList.add('hidden');let view=$('profileView');view.classList.add('active');view.innerHTML=`<div class="profile-topline"><button class="back-btn" id="backToList">← ${t('back_to_prospects')}</button><span class="sub">${esc(T.countries[x.country])} · ${esc(x.id)}</span></div><header class="profile-hero"><div class="profile-brand">${iconHtml(x)}<div><div class="profile-kicker">${t('company_profile')} · ${esc(x.priority)} ${t('priority')}</div><h1 class="profile-name">${esc(x.name)}</h1><div class="profile-sub">${esc(x.location)} · ${esc(industryName(x.sector))}</div></div></div><div class="profile-score"><strong>${x.score}<small style="font:13px Arial">/100</small></strong><span>${t('prospect_score')} · ${t('grade')} ${esc(x.priority)}</span></div></header><div class="profile-sections"><section class="profile-section"><div class="section-kicker">${t('field_notes')} · 01</div><h2>${t('company_overview')}</h2><div class="overview-grid"><div class="detail-item"><small>${t('country_market')}</small><strong>${esc(T.countries[x.country])}</strong></div><div class="detail-item"><small>${t('city_location')}</small><strong>${esc(x.location||'無')}</strong></div><div class="detail-item"><small>${t('industry')}</small><strong>${esc(industryName(x.sector))}</strong></div><div class="detail-item"><small>${t('manufacturing_plant')}</small><strong>${esc(localizeText(x.plant)||'無')}</strong></div></div></section><section class="profile-section"><div class="section-kicker">${t('company_context')} · 02</div><h2>${t('company_business')}</h2><p class="profile-copy">${esc(localizeText(x.business)||'無')}</p><p class="profile-copy" style="margin-top:10px"><b>${t('manufacturing_facilities')}</b><br>${esc(localizeText(x.plant)||'無')} · ${esc(x.location||'無')}</p></section><section class="profile-section full"><div class="section-kicker">${t('opportunity')} · 03</div><h2>${t('opportunity_analysis')}</h2><p class="profile-copy">${esc(localizeText(x.reason)||'無')}</p><div class="detail-item" style="margin-top:12px"><small>${t('research_evidence')}</small><strong>${esc(localizeText(x.evidence)||t('evidence_fallback'))}</strong></div></section><section class="profile-section full"><div class="section-kicker">${t('product_fit')} · 04</div><h2>${t('matched_products')}</h2><div class="product-list">${all.map(p=>`<span class="product-pill">${esc(shortProduct(p))}</span>`).join('')||'<span>無</span>'}</div></section><section class="profile-section full"><div class="section-kicker">${t('public_channels')} · 05</div><h2>${t('contact_information')}</h2><div class="contact-grid">${contactItem(t('official_website'),x.website,'link')}${contactItem(t('public_email'),x.email,'email')}${contactItem(t('contact_form'),x.form,'link')}${contactItem(t('phone'),phone)}${contactItem('LinkedIn',x.linkedin,'link')}${contactItem(t('public_contact_window'),x.publicContact)}</div></section><section class="profile-section"><div class="section-kicker">${t('next_step')} · 06</div><h2>${t('relevant_departments')}</h2><p class="profile-copy">${esc(localizeText(x.department)||'無')}</p><h2 style="margin-top:15px">${t('sales_notes')}</h2><p class="profile-copy">${esc(localizeText(x.strategy)||'無')}</p><label class="foot-label" for="salesNote" style="margin-top:12px">${t('internal_sales_note')}</label><textarea class="profile-textarea" id="salesNote" placeholder="${t('note_placeholder')}">${esc(r.note)}</textarea><button class="save-btn" id="saveNote" style="margin-top:7px">${t('save_note')}</button></section><section class="profile-section"><div class="section-kicker">${t('timeline')} · 07</div><h2>${t('contact_history')}</h2><ul class="history-list" id="historyList">${(r.history||[]).slice().reverse().map(h=>`<li><span class="history-date">${esc(h.date)}</span>${esc(h.text)}</li>`).join('')||`<li>${t('no_history')}</li>`}</ul><div class="history-form"><input id="historyText" class="profile-input" placeholder="${t('history_placeholder')}"><input id="historyDate" class="profile-input" type="date" value="${new Date().toISOString().slice(0,10)}"><button id="addHistory" class="save-btn">${t('add_entry')}</button></div></section><section class="profile-section full"><div class="section-kicker">${t('follow_through')} · 08</div><h2>${t('next_followup')}</h2><div class="follow-row"><label><small class="foot-label">${t('followup_date')}</small><input id="profileFollowup" class="profile-input" type="date" value="${esc(r.followup)}"></label><label><small class="foot-label">${t('current_sales_status')}</small><select id="profileSalesStatus" class="profile-input">${statusOptions(r.salesStatus)}</select></label></div><button class="save-btn" id="saveFollowup" style="margin-top:10px">${t('save_followup')}</button></section></div><p class="notice">${t('profile_notice')}</p>`;$('backToList').onclick=closeProfile;$('saveNote').onclick=()=>{r.note=$('salesNote').value;save();$('saveNote').textContent=t('saved');setTimeout(()=>$('saveNote')&&($('saveNote').textContent=t('save_note')),1300)};$('addHistory').onclick=()=>{let text=$('historyText').value.trim();if(!text)return;r.history=r.history||[];r.history.push({date:$('historyDate').value||new Date().toISOString().slice(0,10),text});save();openProfile(id)};$('saveFollowup').onclick=()=>{r.followup=$('profileFollowup').value;r.salesStatus=$('profileSalesStatus').value;save();$('saveFollowup').textContent=t('saved');setTimeout(()=>$('saveFollowup')&&($('saveFollowup').textContent=t('save_followup')),1300)};window.scrollTo({top:0,behavior:'smooth'})}
function closeProfile(){state.profileId=null;$('profileView').classList.remove('active');$('profileView').innerHTML='';$('listView').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-country]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-country]').forEach(x=>x.classList.toggle('active',x===b));state.country=b.dataset.country;state.industry='';state.product='';$('industryFilter').value='';$('productFilter').value='';buildFilters();draw()}));
$('search').addEventListener('input',e=>{state.query=e.target.value;draw()});$('industryFilter').addEventListener('change',e=>{state.industry=e.target.value;draw()});$('gradeFilter').addEventListener('change',e=>{state.grade=e.target.value;draw()});$('productFilter').addEventListener('change',e=>{state.product=e.target.value;draw()});$('sortBy').addEventListener('change',e=>{state.sort=e.target.value;draw()});
buildFilters();draw();setTimeout(()=>{state.loading=false;draw()},280);
window.__explorer={state,filtered,openProfile,closeProfile,draw,clearFilters,DATA,T,LANG};
</script>
</body>
</html>
